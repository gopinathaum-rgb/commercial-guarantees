name: Commercial Demand and Supply Discovery

on:
  pull_request:
  schedule:
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: commercial-demand-supply-discovery
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run discovery, brokerage and provider tests
        env:
          GITHUB_TOKEN: test-token
        run: |
          python -m unittest discover -s tests -p 'test_github_customer_discovery.py' -v
          python -m unittest discover -s tests -p 'test_procurement_signal_discovery.py' -v
          python -m unittest discover -s tests -p 'test_broker_market.py' -v
          python -m unittest discover -s tests -p 'test_provider_discovery.py' -v

  discover:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover formal ERP procurement notices from official buyer pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/procurement_signal_discovery.py
      - name: Collect public developer discussions as non-commercial research only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/github_customer_discovery.py
      - name: Discover supply from official Frappe partner directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/provider_discovery.py
